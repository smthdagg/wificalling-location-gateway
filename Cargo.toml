[package]
name = "wificalling-location-gateway"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "wificalling_location_gateway"
path = "src/lib.rs"

[[bin]]
name = "wloc-gateway-spike"
path = "src/main.rs"

[[bin]]
name = "wloc-service"
path = "src/bin/wloc-service.rs"

[dependencies]
bytes = "=1.12.1"
h2 = "=0.4.15"
http = "=1.5.0"
prost = { version = "=0.14.4", default-features = false, features = ["derive"] }
rcgen = { version = "=0.14.9", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.145", default-features = false, features = ["std"] }
tokio = { version = "=1.48.0", default-features = false, features = ["io-util", "macros", "net", "rt", "time"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
