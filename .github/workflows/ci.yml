name: repository-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openwrt-cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Fetch pinned Rust build image
        run: >-
          docker pull --platform linux/amd64
          rust@sha256:64232e656c058f4468e8d024e990acff04f0fd5a5c0a88a574dc37773d7325c9
      - name: Build and inspect the real OpenWrt target
        env:
          OPENWRT_CROSS_CACHE_DIR: /tmp/wloc-rust-openwrt-ci
        run: ./scripts/ci/verify-rust-openwrt.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up pinned Rust audit toolchain
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy,llvm-tools-preview
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-llvm-cov --version 0.8.7
      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify repository
        run: ./scripts/ci/verify.sh

  pull-request-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate branch and linked Issue
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          case "$BRANCH_NAME" in
            codex/issue-[0-9]*-*) ;;
            *) echo "Branch must match codex/issue-<number>-<slug>" >&2; exit 1 ;;
          esac
          issue_id=$(printf '%s' "$BRANCH_NAME" | sed -E 's#^codex/issue-([0-9]+)-.*#\1#')
          printf '%s' "$PR_BODY" | grep -Eq "(Closes|Fixes|Resolves) #${issue_id}([^0-9]|$)" || {
            echo "PR body must close branch Issue #$issue_id" >&2
            exit 1
          }
          capsule=".handoffs/issue-${issue_id}.md"
          test -s "$capsule" || {
            echo "PR must contain $capsule" >&2
            exit 1
          }
          printf '%s' "$PR_BODY" | grep -Fq "Handoff capsule: \`$capsule\`" || {
            echo "PR body must reference $capsule" >&2
            exit 1
          }
          ./scripts/ci/verify-handoffs.sh
